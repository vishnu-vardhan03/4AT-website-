name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: Backend/dist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          BACKEND_URL: http://localhost:5000
          NEXTAUTH_SECRET: ci-only-nextauth-secret-value-32chars
          AZURE_AD_CLIENT_ID: ci-client-id
          AZURE_AD_CLIENT_SECRET: ci-client-secret
          AZURE_AD_TENANT_ID: ci-tenant-id
          ESSL_ADMIN_EMAIL: itsupport@consult-4at.com
          ESSL_AUTH_MODE: legacy
          ESSL_ADMIN_PASSWORD: ci-only-temporary-password
          ESSL_INTERNAL_API_KEY: ci-only-internal-api-key-value-32
      - name: Selenium production smoke audit
        run: |
          PORT=3100 npm start > selenium-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://localhost:3100/ > /dev/null && break; sleep 1; done
          npm run test:selenium
        env:
          SELENIUM_BASE_URL: http://localhost:3100
          NEXTAUTH_URL: http://localhost:3100
          NEXT_PUBLIC_API_URL: http://localhost:5000
          BACKEND_URL: http://localhost:5000
          NEXTAUTH_SECRET: ci-only-nextauth-secret-value-32chars
          AZURE_AD_CLIENT_ID: ci-client-id
          AZURE_AD_CLIENT_SECRET: ci-client-secret
          AZURE_AD_TENANT_ID: ci-tenant-id
          ESSL_ADMIN_EMAIL: itsupport@consult-4at.com
          ESSL_AUTH_MODE: legacy
          ESSL_ADMIN_PASSWORD: ci-only-temporary-password
          ESSL_INTERNAL_API_KEY: ci-only-internal-api-key-value-32
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-standalone
          path: |
            Frontend/.next/standalone
            Frontend/.next/static
            Frontend/public
